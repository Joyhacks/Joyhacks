name: Verify OFFFREQ
on:
  push:
    branches: ['main', 'offfreq-listening-room']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify project logic
        run: npm run test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
